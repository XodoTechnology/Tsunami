# Tsunami OS tuning — installed to /etc/sysctl.d/99-tsunami.conf by
# scripts/install.sh (or copy manually). Applies host-wide; review before
# enabling on a shared machine. See DEPLOYMENT.md "OS tuning".
#
# Values below are the aggressive-but-sane preset. For a conservative
# variant see the commented block at the bottom.

# --- Socket buffers -------------------------------------------------------
# SO_RCVBUF semantics: the kernel stores min(2 * value, rmem_max).
# network.socket_recv_buffer = 16777216 (16 MiB) therefore needs
# rmem_max >= 32 MiB just to honor the config. 256 MiB covers
# socket_recv_buffer up to 128 MiB. wmem_max is headroom for TX.
net.core.rmem_max = 268435456
net.core.wmem_max = 268435456

# --- RX backlog -----------------------------------------------------------
# Packets queued between NIC interrupt and socket dequeue. The default
# (1000) is the #1 cause of silent UDP loss under flood. Each entry is
# small; 250k costs tens of MB worst-case.
net.core.netdev_max_backlog = 250000

# --- NAPI budget ----------------------------------------------------------
# Max packets / max time a softirq round processes before rescheduling.
# Defaults (300 / 8000us) throttle a single hot core at high pps. Raising
# both lets one core drain ~4x more per round — good on dedicated cores,
# back off if other latency-sensitive traffic shares the box.
net.core.netdev_budget = 1200
net.core.netdev_budget_usecs = 16000

# --- TCP (HTTP/WS plane) --------------------------------------------------
# Tsunami calls listen(1024); this removes the kernel clamp so raising
# the in-code backlog later doesn't silently no-op. Harmless otherwise.
net.core.somaxconn = 65535

# --- UDP ------------------------------------------------------------------
# Floor for the per-socket UDP memory accounting minimum.
net.ipv4.udp_rmem_min = 16384
# net.ipv4.udp_mem is auto-sized by the kernel from RAM at boot — leave it.

# --- Memory ----------------------------------------------------------------
# The peer store is a large in-RAM structure; don't let the kernel swap
# it out under pressure.
vm.swappiness = 10

# ---------------------------------------------------------------------------
# Conservative alternative (uncomment to use instead of the values above):
#   net.core.rmem_max = 67108864
#   net.core.wmem_max = 67108864
#   net.core.netdev_max_backlog = 50000
#   net.core.netdev_budget = 600
#   net.core.netdev_budget_usecs = 8000
#   net.core.somaxconn = 32768
#   net.ipv4.udp_rmem_min = 8192
#   vm.swappiness = 30
# ---------------------------------------------------------------------------
